name: release-build

on:
  push:
    branches:
      - 'rc/build-**'

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tag from the branch name
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="${BRANCH#rc/build-}"
          if [[ ! "$tag" =~ ^v[0-9]\.[0-9]\.[0-9]-rc\.[0-9]$ ]]; then
            echo "release-build: the branch $BRANCH names no pre-release tag vN.N.N-rc.N"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Embedded App shell matches its source
        run: |
          (cd app/agent/agent/app_shell/web && npm ci --no-audit --no-fund)
          cd app/agent && python3 agent/app_shell/embed.py check --build
      - name: Both notebook copies are the same file
        run: cmp app/agent/agent/dbx_inspire_ai_agent.ipynb app/dbx_inspire_ai_agent.ipynb
      - name: Build the assets
        run: |
          echo '{"machine": "aarch64", "version": "3.12.3"}' > "$RUNNER_TEMP/probe.json"
          cd app/agent && python3 release/build_assets.py --out "$RUNNER_TEMP/assets" --probe "$RUNNER_TEMP/probe.json" --cache "$RUNNER_TEMP/cache"
          mkdir -p "$RUNNER_TEMP/assets_dir" && tar -xf "$RUNNER_TEMP/assets/inspire-assets.tar" -C "$RUNNER_TEMP/assets_dir"
      - name: Build the release files
        run: |
          mkdir -p "$RUNNER_TEMP/src" && git archive "${{ github.sha }}" | tar -x -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/app" && python3 installer/release.py build --assets "$RUNNER_TEMP/assets_dir" --out "$RUNNER_TEMP/release"
          ls -l "$RUNNER_TEMP/release"
      - name: The tag names the version the release carries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$RUNNER_TEMP/release/manifest.json")
          [ "${TAG%%-rc.*}" = "$version" ] || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release-build: $TAG already exists; nothing is replaced"
            exit 1
          fi
          gh release create "$TAG" --prerelease --latest=false --target "${{ github.sha }}" \
            --title "$TAG" --notes "Pre-release $TAG for testing. Not the latest release." \
            "$RUNNER_TEMP/release/inspire_installer.py" "$RUNNER_TEMP/release/manifest.json" \
            "$RUNNER_TEMP/release/inspire-app.zip" "$RUNNER_TEMP/release/inspire-assets.tar"
