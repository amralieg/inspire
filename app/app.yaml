# Inspire AI Databricks App. Install and update it only with inspire_installer.py (see deployment.md): it rewrites this file
# with the App environment, so a Git-backed App or a source-folder deploy opens on the workspace connection wizard.
# start.sh runs node on backend/build/server.js, the backend bundled into the App zip. The runtime injects DATABRICKS_HOST and PORT.

command:
  - "bash"
  - "start.sh"

env:
  - name: "NODE_ENV"
    value: "production"

# Service principal — the Databricks App runtime generates an OAuth token
# and injects it as DATABRICKS_TOKEN env var automatically.
resources:
  - name: "inspire-ai-sp"
    type: "service-principal"
